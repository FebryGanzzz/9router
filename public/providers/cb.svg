<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="55%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E9D5FF"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>

  <!-- lightning bolt -->
  <g filter="url(#glow)">
    <path fill="url(#bolt)"
          d="M73 16 L37 72 L56 72 L47 112 L91 52 L70 52 Z"/>
  </g>

  <!-- network nodes (9router wiring motif) -->
  <circle cx="98" cy="26" r="6" fill="#A78BFA"/>
  <circle cx="30" cy="100" r="5" fill="#A78BFA"/>
  <circle cx="102" cy="100" r="4" fill="#C4B5FD"/>
  <line x1="95" y1="31" x2="98" y2="96" stroke="#A78BFA" stroke-opacity="0.7" stroke-width="2" stroke-dasharray="3 3"/>
  <line x1="35" y1="96" x2="94" y2="98" stroke="#A78BFA" stroke-opacity="0.7" stroke-width="2" stroke-dasharray="3 3"/>
</svg>
